<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/pantalla3.css">
    <title>Cinemax - Asientos</title>
</head>
<body>

<section class="pantalla-asientos">

  <header class="encabezado">
    <a href="pelicula.html" class="volver">‹</a>
    <h2>Selecciona tus asientos</h2>
  </header>

  <section class="zona-cine">
    <div class="pantalla-cine">PANTALLA</div>

    <section class="asientos">
      <p>Cargando asientos...</p>
    </section>
  </section>

  <section class="leyenda-asientos">
    <article>
      <span class="cuadro libre"></span>
      <p>Libre</p>
    </article>

    <article>
      <span class="cuadro ocupado"></span>
      <p>Ocupado</p>
    </article>

    <article>
      <span class="cuadro seleccionado"></span>
      <p>Tu elección</p>
    </article>
  </section>

  <aside class="resumen-asientos">
    <img src="img/img2.png" alt="Horizonte 2077">
    <div class="info-resumen">
      <h3>Horizonte 2077</h3>
      <p class="fecha">24 May • 9:00 PM • IMAX 3D</p>
      <div class="detalle-resumen">
        <div>
          <span class="titulo">ASIENTOS ELEGIDOS</span>
          <div class="asientos-elegidos"></div>
        </div>
        <div class="precio">
          <span class="titulo">TOTAL</span>
          <h2>Bs 0.00</h2>
        </div>
      </div>
    </div>
  </aside>

  <footer>
    <a href="pago.html" class="btn-continuar">Continuar al pago</a>
  </footer>

</section>

<script src="Js/datos.js"></script>
<script src="Js/asientos.js"></script>
</body>
</html>

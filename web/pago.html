<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Compra</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/pago.css">
</head>
<body>
    <section class="pantalla-pago">
        <header class="encabezado">
            <a href="asientos.html" class="volver">‹</a>
            <h2>Resumen de compra</h2>
        </header>

        <section class="tarjeta-pelicula">
            <img src="img/img2.png" alt="Horizonte 2077">
            <article class="info-pelicula">
                <h3>Horizonte 2077</h3>
                <p>24 Mayo 2024 • 9:00 PM</p>
                <p class="sala">Sala IMAX 3D</p>
            </article>
        </section>

        <section class="detalle-compra">
            <article class="item-compra">
                <div>
                    <h4>Entradas</h4>
                    <p>0 entradas</p>
                </div>
                <span>Bs 0.00</span>
            </article>

            <article class="asientos-seleccionados">
                <h4>Asientos</h4>
                <div class="lista-asientos"></div>
            </article>

            <article class="costos">
                <div class="fila-costo">
                    <span>Subtotal</span>
                    <span>Bs 0.00</span>
                </div>
                <div class="fila-costo">
                    <span>Cargos por servicio</span>
                    <span>Bs 15.00</span>
                </div>
            </article>

            <article class="total-compra">
                <h3>Total</h3>
                <span>Bs 0.00</span>
            </article>
        </section>

        <section class="metodos-pago">
            <h4>Método de pago</h4>
            <label class="opcion-pago">
                <input type="radio" name="pago" value="Tarjeta de Crédito" checked>
                <span>Tarjeta de Crédito</span>
            </label>

            <label class="opcion-pago">
                <input type="radio" name="pago" value="Apple Pay">
                <span>Apple Pay</span>
            </label>
        </section>

        <footer class="acciones">
            <a href="verificacion.html" class="btn-pagar">PAGAR Bs 0.00</a>
        </footer>
    </section>

<script src="Js/datos.js"></script>
<script src="Js/pago.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Compra</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <section class="pantalla-pago">
        <header class="encabezado">
            <a href="pantalla3.html" class="volver">‹</a>
            <h2>Resumen de compra</h2>
        </header>

        <section class="tarjeta-pelicula">
            <img src="img/img2.png" alt="Horizonte 2077">
            <article class="info-pelicula">
                <h3>Horizonte 2077</h3>
                <p>24 Mayo 2024 • 9:00 PM</p>
                <p class="sala">Sala IMAX 3D</p>
            </article>
        </section>

        <section class="detalle-compra">
            <article class="item-compra">
                <div>
                    <h4>Entradas</h4>
                    <p>2 entradas</p>
                </div>
                <span>Bs 150.00</span>
            </article>

            <article class="asientos-seleccionados">
                <h4>Asientos</h4>
                <div class="lista-asientos">                    <span>C3</span>
                    <span>C4</span>
                </div>
            </article>

            <article class="costos">
                <div class="fila-costo">
                    <span>Subtotal</span>
                    <span>Bs 150.00</span>

                </div>
                <div class="fila-costo">
                    <span>Cargos por servicio</span>
                    <span>Bs 15.00</span>
                </div>
            </article>

            <article class="total-compra">
                <h3>Total</h3>
                <span>Bs 165.00</span>
            </article>
        </section>

        <section class="metodos-pago">
            <h4>Método de pago</h4>
            <label class="opcion-pago">
                <input type="radio" name="pago" checked>
                <span>Tarjeta de Crédito</span>
            </label>

            <label class="opcion-pago">
                <input type="radio" name="pago">
                <span>Apple Pay</span>
            </label>
        </section>

        <footer class="acciones">
            <a href="pantalla5.html" class="btn-pagar">
                PAGAR Bs 165.00
            </a>
        </footer>
    </section>
</body>
</html>
